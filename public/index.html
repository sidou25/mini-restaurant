<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0c">
  <title>Brother</title>
  <!-- Application installable sur le téléphone -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="48x48" href="/icons/favicon-48.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Brother">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Écran de connexion / premier lancement -->
  <div id="auth" class="auth hidden">
    <form id="auth-form" class="auth-card">
      <div class="logo big"><span class="logo-mark">B</span><span class="logo-text">BROTHER</span></div>
      <h1 id="auth-title">Connexion</h1>
      <p id="auth-help" class="muted"></p>
      <label id="code-field" class="hidden">Code d'installation <input name="code" autocomplete="off" inputmode="numeric"></label>
      <label>Nom d'utilisateur <input name="username" autocomplete="username" autocapitalize="none" required></label>
      <label>Mot de passe <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary big" id="auth-btn">Se connecter</button>
      <p id="auth-error" class="error"></p>
    </form>
  </div>

  <!-- Application -->
  <div id="shell" class="hidden">
    <header class="top">
      <div class="logo"><span class="logo-mark" id="logo-mark">B</span><span class="logo-text" id="resto-name">BROTHER</span></div>
      <nav id="nav"></nav>
      <div class="me">
        <button class="btn primary small hidden" id="install">📲 Installer</button>
        <span id="me-name"></span>
        <button class="btn ghost small" id="logout" title="Se déconnecter">Sortir</button>
      </div>
    </header>
    <main id="page"></main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-box" id="modal-box"></div></div>
  <div id="toast" class="toast"></div>
  <!-- Bon de commande : visible seulement à l'impression -->
  <div id="ticket"></div>

  <script src="/app.js"></script>
</body>
</html>
